name: Daily Kindle Push

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装中文字体（绘图需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: 安装依赖
        run: pip install -r scripts/requirements.txt
      - name: 生成仪表盘图并推送到 Kindle
        env:
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
        run: python scripts/send_to_kindle.py
